name: artic-marketplace

services:
  postgres:
    image: postgres:16-alpine
    container_name: artic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Market_Place
      POSTGRES_USER: artic_user
      POSTGRES_PASSWORD: Artic$2026
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artic_user -d Market_Place']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: artic_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
