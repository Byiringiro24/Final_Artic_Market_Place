name: artic-marketplace

services:
  redis:
    image: redis:7-alpine
    container_name: artic_marketplace_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - artic_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artic_marketplace_backend
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      - artic_uploads:/app/uploads
      - artic_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artic_marketplace_frontend
    restart: unless-stopped
    ports:
      - '3010:3000'
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.production

volumes:
  artic_redis_data:
  artic_uploads:
  artic_logs:
